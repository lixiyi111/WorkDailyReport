[project]
name = "daily-report-v2-superpowers"
version = "0.1.0"
description = "智能日报生成器 v2（Superpowers 工作流驱动）"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的 Depends/Query 作为参数默认值是官方用法
"app/api/**" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
