[project]
name = "daily-report-v1-sdd"
version = "0.1.0"
description = "智能日报生成器 v1（SDD 规范驱动开发）"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008：FastAPI 的 Depends/Query 必须写在默认参数里；E501：长行由人工控制
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
